<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Detalles del Producto</title>
</head>

<body>

    <header class="main-header">
        <div class="logo">TECH CHRONICLE</div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">BLOG</a></li>
                <li><a href="tienda.html">TIENDA</a></li>
                <li><a href="admin.html" class="active">ADMIN</a></li>
            </ul>
        </nav>
        <div class="cart-icon">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count">3</span>
        </div>
    </header>
    <main class="admin-container">
        
        <input type="hidden" id="producto-sku" value="">

        <section class="product-main-content">

            <div class="product-gallery">
                <div class="main-image">
                    <img id="main-product-image" src="" alt="Imagen Principal del Producto">
                </div>
                <div class="thumbnails-grid">
                    <img src="/assets/img/Laptop-Ultra-Pro-Z-1.webp" alt="Vista lateral" class="thumbnail active">
                    <img src="/assets/img/Laptop-Ultra-Pro-Z-2.webp" alt="Vista teclado" class="thumbnail">
                    <img src="/assets/img/Laptop-Ultra-Pro-Z-3.webp" alt="Vista trasera" class="thumbnail">
                    <img src="/assets/img/Laptop-Ultra-Pro-Z-4.webp" alt="Embalaje" class="thumbnail">
                </div>
            </div>

            <div class="product-description-area">
                <h1 id="product-title" class="product-title"></h1>

                <div class="rating-bar">
                    <i class="fas fa-star filled"></i>
                    <i class="fas fa-star filled"></i>
                    <i class="fas fa-star filled"></i>
                    <i class="fas fa-star filled"></i>
                    <i class="fas fa-star-half-alt filled"></i>
                    <span class="rating-text">(1,254 valoraciones)</span>
                </div>
                
                <div class="product-specs">
                    <h2 class="specs-title">Categoría</h2>
                    <p id="product-category"></p> 
                    <h2 class="specs-title">Stock y Peso</h2>
                    <ul id="product-stock-peso">
                        </ul>
                </div>

                <div class="model-selector-group">
                    <h2 class="selector-title">Elige el Modelo/Configuración:</h2>
                    <div class="model-options">
                        <label class="model-option active">
                            <input type="radio" name="model" value="16-512" checked>
                            <span class="model-name">16GB RAM / 512GB SSD</span>
                            <span class="model-price">450,99 €</span>
                        </label>
                        <label class="model-option">
                            <input type="radio" name="model" value="32-1TB">
                            <span class="model-name">32GB RAM / 1TB SSD</span>
                            <span class="model-price">599,99 €</span>
                        </label>
                        <label class="model-option disabled">
                            <input type="radio" name="model" value="64-2TB" disabled>
                            <span class="model-name">64GB RAM / 2TB SSD</span>
                            <span class="model-status">Agotado</span>
                        </label>
                    </div>
                </div>

                <div class="detailed-description">
                    <h2 class="description-title">Descripción Completa</h2>
                    <p id="product-long-description">
                        </p>
                    <h2 class="description-title">SKU del Mayorista</h2>
                    <p id="product-sku-id"></p>
                </div>
            </div>

            <aside class="purchase-panel">
                <div class="price-box">
                    <span class="label">Precio:</span>
                    <span id="product-price" class="current-price"></span>
                </div>

                <div id="stock-status" class="stock-info">
                    </div>

                <div class="shipping-info">
                    Envío GRATIS mañana.
                </div>

                <div class="quantity-control">
                    <label for="quantity-select">Cantidad:</label>
                    <select id="quantity-select" class="qty-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>

                <button class="add-to-cart-btn main-action-btn">
                    <i class="fas fa-shopping-cart"></i> Añadir a la Cesta
                </button>
                <button class="buy-now-btn secondary-action-btn">
                    Comprar ahora
                </button>

                <div class="guarantee-info">
                    <i class="fas fa-lock"></i>
                    <span>Transacción segura. 3 años de garantía.</span>
                </div>
            </aside>

        </section>
    </main>

    <script src="assets/js/pages/productoDetalle.js"></script>
</body>
</html>
