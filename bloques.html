<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
    <title>Editor de Bloques de Contenido</title>
</head>
<body>

    <header class="main-header">
        <div class="logo">TECH CHRONICLE</div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">BLOG</a></li>
                <li><a href="tienda.html">TIENDA</a></li>
                <li><a href="admin.html" class="active">ADMIN</a></li>
            </ul>
        </nav>
        <div class="cart-icon">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count">3</span>
        </div>
    </header>

    <main class="admin-container">

        <aside class="admin-sidebar">
            <div class="user-info">
                <h4><i class="fas fa-user-circle"></i> Administrador</h4>
                <p>Bienvenido al Panel</p>
            </div>

            <nav class="admin-nav-links">
                <ul>
                    <li><a href="admin.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li><a href="admin_post.html"><i class="fas fa-pencil-alt"></i> Gestión de Posts</a></li>
                    <li><a href="admin_productos.html"><i class="fas fa-box"></i> Gestión de Productos</a></li>
                    <li><a href="admin_usuarios.html"><i class="fas fa-users"></i> Gestión de Usuarios</a></li>
                    <li><a href="IA.html"><i class="fa-solid fa-microphone"></i>Asistente IA (Gemini)</a></li>
                    <li><a href="imagenes.html"><i class="fa-solid fa-image"></i>Imagenes</a></li>
                    <li><a href="admin_reportes.html"><i class="fas fa-chart-line"></i> Reportes y Stats</a></li>
                    <li><a href="admin_configuracion.html"><i class="fas fa-cog"></i> Configuración</a></li>
                </ul>
            </nav>

            <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
        </aside>

        <div class="editor-contenedor">

            

            <header class="post-header">
                <input type="text" class="post-titulo" placeholder="Título del Post (Bloque principal)">
            </header>
            
            <div class="bloques-lista">

                <div class="bloque-item" data-id="1" data-orden="1">
                    <div class="bloque-controles">
                        <select class="bloque-tipo" name="tipo-bloque-1">
                            <option value="titulo">Titulo</option>
                            <option value="parrafo">Párrafo</option>
                            <option value="imagen">Imagen</option>
                            <option value="lista">Lista</option>
                            <option value="codigo">Código</option>
                        </select>
                        <span class="bloque-orden">Orden: 1</span>
                        <button class="bloque-mover arriba" aria-label="Mover bloque hacia arriba">⬆️</button>
                        <button class="bloque-mover abajo" aria-label="Mover bloque hacia abajo">⬇️</button>
                        <button class="bloque-eliminar" aria-label="Eliminar bloque">🗑️</button>
                    </div>
                    
                    <div class="bloque-contenido bloque-encabezado">
                        <input type="text" placeholder="Escribe tu encabezado aquí (H2)">
                    </div>
                </div>
                <div class="bloque-item" data-id="2" data-orden="2">
                    <div class="bloque-controles">
                        <select class="bloque-tipo" name="tipo-bloque-2">
                            <option value="titulo">Titulo</option>
                            <option value="parrafo" selected>Párrafo</option>
                            <option value="imagen">Imagen</option>
                            <option value="lista">Lista</option>
                            <option value="codigo">Código</option>
                        </select>
                        <span class="bloque-orden">Orden: 2</span>
                        <button class="bloque-mover arriba">⬆️</button>
                        <button class="bloque-mover abajo">⬇️</button>
                        <button class="bloque-eliminar">🗑️</button>
                    </div>
                    
                    <div class="bloque-contenido bloque-parrafo">
                        <textarea placeholder="Empieza a escribir el contenido de tu párrafo..."></textarea>
                    </div>
                </div>
                <div class="bloque-item" data-id="3" data-orden="3">
                    <div class="bloque-controles">
                        <select class="bloque-tipo" name="tipo-bloque-3">
                            <option value="titulo">Titulo</option>
                            <option value="parrafo">Párrafo</option>
                            <option value="imagen" selected>Imagen</option>
                            <option value="lista">Lista</option>
                        </select>
                        <span class="bloque-orden">Orden: 3</span>
                        <button class="bloque-mover arriba">⬆️</button>
                        <button class="bloque-mover abajo">⬇️</button>
                        <button class="bloque-eliminar">🗑️</button>
                    </div>
                    
                    <div class="bloque-contenido bloque-imagen">
                        <input type="file" accept="image/*">
                        <input type="text" placeholder="Pie de foto (opcional)">
                        </div>
                </div>
                </div>

            <button class="add-button">➕ Añadir Nuevo Bloque</button>
            <button class="add-button">💾 Crear Artículo</button>

        </div>
    </main>

</body>
</html>
