        <div class="admin-content-area" style="padding: 30px; margin: 0 auto; max-width: 600px;">
        
            <h1>Crear Nuevo Usuario</h1>
            
            <form id="registroForm" class="config-form" action="/api/usuarios" method="POST">
                
                
                
                <div class="form-group">
                    <label for="nombreUsuario">Nombre de Usuario</label>
                    <input type="text" id="nombreUsuario" name="nombreUsuario" required maxlength="50">
                </div>
                
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required maxlength="100">
                </div>
                
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" required minlength="8">
                </div>
                
                <div class="form-group">
                    <select id="tipoUsuario" name="tipoUsuario" required>
                        <option value="" disabled selected>Selecciona un rol</option>
                    </select>
                    
                </div>
                
                <button type="submit" class="add-button"><i class="fas fa-user-plus"></i> Crear Usuario</button>
            </form>
        </div>
        
        <script  type="module" src="/assets/js/pages/crearUsuario.js"></script>
