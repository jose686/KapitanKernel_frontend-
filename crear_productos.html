<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nuevo Producto</title>
    <link rel="stylesheet" href="assets/css/styles.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body style="padding-top: 50px;"> 
    
    <div class="admin-content-area" style="padding: 30px; margin: 0 auto; max-width: 600px;">
        
        <h1>Crear Nuevo Producto</h1>
        
        <form id="productoForm" class="config-form" action="/api/productos" method="POST">

            <div class="form-group">
                <label for="idProducto">ID de Producto</label>
                <input 
                    type="text" 
                    id="idProducto" 
                    name="idProducto" 
                    value="ID generado automáticamente (Referencia)" 
                    readonly 
                    style="background-color: var(--color-light);">
            </div>

            <div class="form-group">
                <label for="idCategoria">Categoría del Producto</label>
                <select id="idCategoria" name="idCategoria" required>
                    <option value="" disabled selected>Selecciona una categoría</option>
                    <option value="1">Electrónica</option>
                    <option value="2">Ropa</option>
                    <option value="3">Hogar</option>
                    </select>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre del Producto</label>
                <input type="text" id="nombre" name="nombre" required maxlength="150">
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción del Producto</label>
                <textarea id="descripcion" name="descripcion" rows="5" required 
                    style="width: 100%; max-width: 400px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; box-sizing: border-box;"></textarea>
            </div>

            <div class="form-group">
                <label for="precio">Precio ($)</label>
                <input type="number" id="precio" name="precio" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="stock">Stock (Unidades)</label>
                <input type="number" id="stock" name="stock" min="0" required>
            </div>

            <a href="admin_productos.html" class="add-button" ><i class="fas fa-user-open"></i> Añadir Producto</a>
        </form>
    </div>
</body>
</html>
